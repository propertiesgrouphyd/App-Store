<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <title>
    Vidhwaan App Store
  </title>

  <meta
    name="description"
    content="Discover AI, Education, Spirituality, Business, Productivity and Community applications built by Vidhwaan."
  >

  <meta
    name="theme-color"
    content="#07111f"
  >

  <meta
    property="og:type"
    content="website"
  >

  <meta
    property="og:title"
    content="Vidhwaan App Store"
  >

  <meta
    property="og:description"
    content="Discover amazing applications built by Vidhwaan."
  >

  <meta
    property="og:image"
    content="./icons/icon-512.png"
  >

  <link
    rel="icon"
    href="./favicon.ico"
  >

  <link
    rel="stylesheet"
    href="./main.css"
  >

</head>

<body>

  <!-- Background -->

  <div class="bgOrb orb1"></div>
  <div class="bgOrb orb2"></div>
  <div class="bgOrb orb3"></div>

  <!-- Main -->

  <main id="app">

    <!-- Hero -->

    <section class="hero">

      <div class="heroBadge">

        VIDHWAAN APP STORE

      </div>

      <h1>

        Discover Amazing Apps
        Built By Vidhwaan

      </h1>

      <p>

        AI.
        Education.
        Spirituality.
        Productivity.
        Business.
        Community.

        One Unified Ecosystem.

      </p>

    </section>

    <!-- Search -->

    <section class="searchSection">

      <div class="searchWrap">

        <input
          id="appSearch"
          type="search"
          placeholder="Search apps..."
          autocomplete="off"
        >

      </div>

    </section>

    <!-- Featured -->

    <section class="section">

      <div class="sectionHeader">

        <h2>

          Featured Apps

        </h2>

      </div>

      <div
        id="featuredApps"
        class="featuredApps"
      ></div>

    </section>

    <!-- Categories -->

    <section class="section">

      <div class="sectionHeader">

        <h2>

          Categories

        </h2>

      </div>

      <div
        id="categories"
        class="categories"
      ></div>

    </section>

    <!-- Search Results -->

    <section class="section">

      <div class="sectionHeader">

        <h2>

          Apps

        </h2>

      </div>

      <div
        id="appsGrid"
        class="appsGrid"
      ></div>

    </section>

    <!-- Empty State -->

    <section
      id="emptyState"
      class="emptyState"
    >

      <h3>

        Search To Discover Apps

      </h3>

      <p>

        Find AI, Education, Village,
        Business and Community apps.

      </p>

    </section>

    <!-- Footer -->

    <footer id="footer">

      <img
        src="./icons/logo.png"
        alt="Vidhwaan"
      >

      <p>

        Powered By Vidhwaan

      </p>

    </footer>

  </main>

  <script
    src="./app.js"
    defer
  ></script>

</body>

</html>
