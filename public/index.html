<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <title>
    Vidhwaan App Store
  </title>

  <meta
    name="description"
    content="Discover and launch applications built by Vidhwaan."
  >

  <meta
    name="keywords"
    content="Vidhwaan, Vidhwaan App Store, Apps, AI, Marketplace, Education, Community, Technology"
  >

  <meta
    name="author"
    content="Vidhwaan"
  >

  <meta
    name="robots"
    content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1"
  >

  <meta
    name="theme-color"
    content="#07111f"
  >

  <link
    rel="canonical"
    href="https://store.vidhwaan.com"
  >

  <meta
    property="og:type"
    content="website"
  >

  <meta
    property="og:site_name"
    content="Vidhwaan App Store"
  >

  <meta
    property="og:title"
    content="Vidhwaan App Store"
  >

  <meta
    property="og:description"
    content="Discover and launch applications built by Vidhwaan."
  >

  <meta
    property="og:url"
    content="https://store.vidhwaan.com"
  >

  <meta
    property="og:image"
    content="https://store.vidhwaan.com/icons/icon-512.png"
  >

  <meta
    name="twitter:card"
    content="summary_large_image"
  >

  <meta
    name="twitter:title"
    content="Vidhwaan App Store"
  >

  <meta
    name="twitter:description"
    content="Discover and launch applications built by Vidhwaan."
  >

  <meta
    name="twitter:image"
    content="https://store.vidhwaan.com/icons/icon-512.png"
  >

  <link
    rel="icon"
    href="./favicon.ico"
  >

  <link
    rel="stylesheet"
    href="./main.css"
  >

  <script type="application/ld+json">
  {
    "@context":"https://schema.org",
    "@type":"WebSite",
    "name":"Vidhwaan App Store",
    "url":"https://store.vidhwaan.com",
    "description":"Discover and launch applications built by Vidhwaan.",
    "publisher":{
      "@type":"Organization",
      "name":"Vidhwaan",
      "url":"https://vidhwaan.com"
    }
  }
  </script>

</head>

<body>

  <div class="bgOrb orb1"></div>
  <div class="bgOrb orb2"></div>
  <div class="bgOrb orb3"></div>

  <main id="app">

    <section class="hero">

      <img
        class="heroLogo"
        src="./icons/logo.png"
        alt="Vidhwaan App Store"
      >

      <div class="heroBadge">

        VIDHWAAN APP STORE

      </div>

      <h1>

        Vidhwaan
        App Store

      </h1>

      <p>

        Discover and launch applications
        built across the Vidhwaan ecosystem.

      </p>

    </section>



    <section class="section">

      <div class="sectionHeader">

        <h2>

          Featured Apps

        </h2>

      </div>

      <div
        id="featuredApps"
        class="featuredApps"
      ></div>

    </section>

    <section class="searchSection">

      <div class="searchWrap">

        <input
          id="appSearch"
          type="search"
          placeholder="Search apps..."
          autocomplete="off"
        >

      </div>

    </section>


    <section class="section">

      <div
        id="appsGrid"
        class="appsGrid"
      ></div>

    </section>

    <section
      id="emptyState"
      class="emptyState"
    >

      <h3>

        Search To Discover Apps

      </h3>

      <p>

        Search any Vidhwaan application
        to instantly find and launch it.

      </p>

    </section>

    <footer id="footer">

      <p>

        © Vidhwaan

      </p>

    </footer>

  </main>

  <script
    src="./app.js"
    defer
  ></script>

</body>

</html>
