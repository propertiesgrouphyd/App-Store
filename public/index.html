<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta
        http-equiv="X-UA-Compatible"
        content="IE=edge">

    <title>

        VIDHWAAN App Store

    </title>

    <meta
        name="description"
        content="Official VIDHWAAN App Store. Discover and launch applications from the VIDHWAAN ecosystem.">

    <meta
        name="theme-color"
        content="#0b1120">

    <link
        rel="icon"
        href="favicon.ico">

    <link
        rel="manifest"
        href="manifest.json">

    <link
        rel="stylesheet"
        href="main.css">

</head>

<body>

    <!-- ===================================================== -->
    <!-- HEADER -->
    <!-- ===================================================== -->

    <header class="header">

        <div class="container">

            <a
                href="https://vidhwaan.com"
                target="_blank"
                class="logo">

                <img
                    src="https://store.vidhwaan.com/icons/logo.png"
                    alt="VIDHWAAN">

                <span>

                    VIDHWAAN App Store

                </span>

            </a>

        </div>

    </header>





    <!-- ===================================================== -->
    <!-- SEARCH -->
    <!-- ===================================================== -->

    <section class="search-section">

        <div class="container">

            <h1>

                Discover Applications

            </h1>

            <p>

                Explore applications from the VIDHWAAN ecosystem.

            </p>

            <div class="search-box">

                <input

                    id="searchInput"

                    type="text"

                    placeholder="Search applications...">

                <button

                    id="searchButton">

                    Search

                </button>

            </div>

            <div
                id="appCount"
                class="app-count">

                Loading applications...

            </div>

        </div>

    </section>





    <!-- ===================================================== -->
    <!-- APPS -->
    <!-- ===================================================== -->

    <main class="container">

        <div

            id="appsGrid"

            class="apps-grid">

        </div>

    </main>





    <!-- ===================================================== -->
    <!-- EMPTY -->
    <!-- ===================================================== -->

    <div

        id="emptyState"

        class="empty-state"

        hidden>

        <h2>

            No Applications Found

        </h2>

        <p>

            Try searching with another name.

        </p>

    </div>





    <!-- ===================================================== -->
    <!-- FOOTER -->
    <!-- ===================================================== -->

    <footer>

        <p>

            © 2026 VIDHWAAN

        </p>

    </footer>





    <script
        src="app.js"></script>

</body>

</html>
