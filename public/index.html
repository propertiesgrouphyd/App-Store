<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  />

  <title>
    Vidhwaan App Store
  </title>

  <meta
    name="description"
    content="Discover AI, education, spirituality, productivity, business and developer applications built by Vidhwaan."
  />

  <meta
    name="keywords"
    content="Vidhwaan, App Store, AI Apps, KidLab, Bhagavad Gita, Quotes, Productivity Apps, Education Apps"
  />

  <meta
    name="author"
    content="Vidhwaan"
  />

  <meta
    name="theme-color"
    content="#07111f"
  />

  <meta
    property="og:type"
    content="website"
  />

  <meta
    property="og:title"
    content="Vidhwaan App Store"
  />

  <meta
    property="og:description"
    content="Discover and access the complete ecosystem of Vidhwaan applications."
  />

  <meta
    property="og:image"
    content="./icons/icon-512.png"
  />

  <meta
    property="og:url"
    content="https://apps.vidhwaan.com"
  />

  <link
    rel="icon"
    href="./favicon.ico"
    sizes="any"
  />

  <link
    rel="stylesheet"
    href="./main.css"
  />

</head>

<body>

  <!-- Splash -->

  <div id="appSplash">

    <img
      src="./icons/icon-192.png"
      alt="Vidhwaan"
    />

  </div>

  <!-- Background -->

  <div class="bgOrb orb1"></div>
  <div class="bgOrb orb2"></div>
  <div class="bgOrb orb3"></div>

  <!-- Main -->

  <main id="app">

    <!-- Hero -->

    <section class="heroSection">

      <div class="heroLogoWrap">

        <img
          src="./icons/logo.png"
          alt="Vidhwaan"
          class="heroLogo"
        />

      </div>

      <div class="heroContent">

        <div class="heroBadge">

          VIDHWAAN APP STORE

        </div>

        <h1>

          Discover Amazing Apps Built By Vidhwaan

        </h1>

        <p class="heroText">

          AI...
          Education...
          Productivity...
          Spirituality...
          Business...
          Developer Tools...

          all in one unified ecosystem.

        </p>

      </div>

    </section>

    <!-- Search -->

    <section class="sectionBlock">

      <div class="searchWrap">

        <input
          id="appSearch"
          type="search"
          placeholder="Search apps..."
          autocomplete="off"
        />

      </div>

    </section>

    <!-- Featured -->

    <section class="sectionBlock">

      <div class="sectionTitleWrap">

        <h2>

          Featured Apps

        </h2>

      </div>

      <div id="featuredApps"></div>

    </section>

    <!-- Search Results -->

    <section class="sectionBlock">

      <div class="sectionTitleWrap">

        <h2>

          Apps

        </h2>

      </div>

      <div id="appsGrid"></div>

    </section>

    <!-- Footer -->

    <footer id="footer">

      <img
        src="./icons/logo.png"
        alt="Vidhwaan"
        class="footerLogo"
      />

      <p>

        Powered By Vidhwaan

      </p>

    </footer>

  </main>

  <script
    src="./app.js"
    defer
  ></script>

</body>

</html>
